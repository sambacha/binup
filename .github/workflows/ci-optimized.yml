name: Optimized CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

# Cancel previous runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  # Enable cargo's sparse registry protocol
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  # Determine what changed to optimize builds
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      windows: ${{ steps.filter.outputs.windows }}
      macos: ${{ steps.filter.outputs.macos }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'rust-toolchain.toml'
            windows:
              - 'src/**/*windows*.rs'
              - 'src/**/*win*.rs'
              - 'src/bin/gup_bootstrap.rs'
              - 'tests/*windows*.rs'
              - '.github/workflows/**/*windows*'
            macos:
              - 'src/**/*macos*.rs'
              - 'src/**/*darwin*.rs'
              - 'tests/*macos*.rs'
              - '.github/workflows/**/*macos*'
            ci:
              - '.github/workflows/**'

  # Quick checks that should run on every PR
  quick-checks:
    name: Quick Checks
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust
          shared-key: quick-checks
      
      - name: Check formatting
        run: cargo fmt --all -- --check
      
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      
      - name: Check documentation
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # Fast Linux-only tests for quick feedback
  linux-test:
    name: Linux Tests (Fast Feedback)
    runs-on: ubuntu-latest
    needs: [changes, quick-checks]
    if: needs.changes.outputs.rust == 'true'
    strategy:
      matrix:
        rust: [stable]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      
      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust
          shared-key: linux-${{ matrix.rust }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      
      - name: Build
        run: cargo build --verbose
      
      - name: Run tests
        run: cargo test --verbose
      
      - name: Run tests with all features
        run: cargo test --all-features --verbose
      
      - name: Install BATS
        run: sudo apt-get update && sudo apt-get install -y bats
      
      - name: Run BATS shell integration tests
        run: ./tests/run_bats.sh
      
      - name: Store build time
        if: always()
        run: |
          echo "linux_test_duration=$(( SECONDS - start_time ))" >> $GITHUB_ENV
          echo "::notice::Linux test duration: $(( SECONDS - start_time ))s"
        env:
          start_time: ${{ steps.start.outputs.time }}

  # Platform-specific tests only run when relevant files change
  windows-test:
    name: Windows Tests
    runs-on: windows-latest
    needs: [changes, quick-checks]
    # Only run if Windows-specific files changed OR it's a push to main
    if: needs.changes.outputs.windows == 'true' || github.event_name == 'push'
    strategy:
      matrix:
        rust: [stable]
        target: [x86_64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: ${{ matrix.target }}
      
      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust
          shared-key: windows-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      
      - name: Build
        run: cargo build --target ${{ matrix.target }} --verbose
      
      - name: Run tests
        run: cargo test --target ${{ matrix.target }} --verbose
      
      - name: Run Windows-specific tests
        run: cargo test --target ${{ matrix.target }} --test windows_shim_tests --features selfupdate

  macos-test:
    name: macOS Tests
    runs-on: macos-latest
    needs: [changes, quick-checks]
    # Only run if macOS-specific files changed OR it's a push to main
    if: needs.changes.outputs.macos == 'true' || github.event_name == 'push'
    strategy:
      matrix:
        rust: [stable]
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: ${{ matrix.target }}
      
      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust
          shared-key: macos-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      
      # Only run tests on native architecture
      - name: Build
        run: cargo build --target ${{ matrix.target }} --verbose
      
      - name: Run tests (native only)
        if: matrix.target == 'x86_64-apple-darwin' && runner.arch == 'X64' || matrix.target == 'aarch64-apple-darwin' && runner.arch == 'ARM64'
        run: cargo test --target ${{ matrix.target }} --verbose
      
      - name: Install BATS (native only)
        if: (matrix.target == 'x86_64-apple-darwin' && runner.arch == 'X64') || (matrix.target == 'aarch64-apple-darwin' && runner.arch == 'ARM64')
        run: brew install bats-core
      
      - name: Run BATS shell integration tests (native only)
        if: (matrix.target == 'x86_64-apple-darwin' && runner.arch == 'X64') || (matrix.target == 'aarch64-apple-darwin' && runner.arch == 'ARM64')
        run: ./tests/run_bats.sh

  # Comprehensive tests only on main branch or release prep
  comprehensive-test:
    name: Comprehensive Platform Tests
    needs: [linux-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: windows-latest
            target: i686-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools
      
      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust
          shared-key: comprehensive-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      
      - name: Build
        run: cargo build --target ${{ matrix.target }}
      
      - name: Test
        run: cargo test --target ${{ matrix.target }}

  # Code coverage only on Linux for efficiency
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [linux-test]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust
          shared-key: coverage
      
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      
      - name: Generate coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
      
      - name: Upload to codecov.io
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # Build performance tracking
  build-timing:
    name: Track Build Performance
    runs-on: ubuntu-latest
    needs: [linux-test, windows-test, macos-test]
    if: always()
    steps:
      - name: Collect build times
        run: |
          echo "## Build Performance Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Duration |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Linux Tests | ${{ needs.linux-test.outputs.duration || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows Tests | ${{ needs.windows-test.outputs.duration || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS Tests | ${{ needs.macos-test.outputs.duration || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY

  # Security audit weekly or on security-related changes
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[security]')
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}