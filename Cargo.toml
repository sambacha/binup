[package]
name = "gup"
version = "0.1.0" # Reset version for the new project
description = "A generic installer and version multiplexer"
repository = "https://github.com/gup-project/gup"
license = "MIT"
keywords = ["installer", "version-manager", "multiplexer", "cli"]
categories = ["command-line-utilities"]
edition = "2021"
default-run = "gup" # Changed from juliaup
authors = ["David Anthoff <anthoff@berkeley.edu>"] # This can be updated if authors change
exclude = [
    ".github/**",
    ".vscode/**",
    ".wix/**",
    "deploy/**",
    "devdocs/**",
    "scripts/**",
    "*.legacy",
]

[profile.release]
lto = true
codegen-units = 1

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
dunce = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0.18"
anyhow = "1.0.72"
tempfile = "3.12"
flate2 = "1.0"
tar = "0.4.39"
zip = "2.1.3" # Added zip crate
normpath = "1.3"
fs_extra = "1.3.0"
thiserror = "2.0"
indicatif = "0.17"
console = "0.15"
ctrlc = "3.4"
url = { version = "2.4.0", features = ["serde"] }
cli-table = "0.5.0"
itertools = "0.14.0"
cluFlock = "1.2.7"
chrono = { version = "0.4.38", features = ["serde"] } # Updated version
human-panic = "2.0"
log = "0.4.25"
env_logger = "0.11"
dialoguer = "0.11.0"
shellexpand = "3.1.0"
env_proxy = "0.4.1"
bstr = "1.10"
indoc = "2.0.3"
is-terminal = "0.4"
path-absolutize = "3.1.0"
human-sort = "0.2.2"
regex = "1.10"
termcolor = "1.4" # Added termcolor
user_dirs = "0.2.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.1", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Console", "Win32_System_Threading", "Services_Store", "Foundation", "Foundation_Collections", "Web_Http", "Web_Http_Headers", "Storage_Streams", "Management_Deployment"] }

[target.'cfg(target_os = "macos")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls", "socks"] }

[target.'cfg(all(not(target_os = "macos"),not(windows)))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots", "socks"] }

[target.'cfg(not(windows))'.dependencies]
nix = { version = "0.29.0", features = ["process"] }

[build-dependencies]
anyhow = "1.0.72"
itertools = "0.14.0"
serde = { version = "1.0.175", features = ["derive"] }
serde_json = "1.0.103"
semver = "1.0.18"
built = "0.7.1"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[dev-dependencies]
assert_cmd = "2.0"
assert_fs = "1.1"
indoc = "2.0"
predicates = "3.1"

[features]
selfupdate = [] # Keep selfupdate feature
windowsstore = [] # May remove or adapt if gup is not Windows Store specific
windowsappinstaller = [] # May remove or adapt
dummy = [] # Keep for testing if still relevant
bingupbootstrap = [] # Renamed from binjuliainstaller
# binjulialauncher is removed
winpkgidentityext = [] # May remove or adapt

[package.metadata.msix]
winstoremsix = { file = "deploy/msix/PackagingLayout.xml", variables = [
    {name = "FlatBundle", value="false"},
    {name = "PublisherDisplayName", value="Julia Computing, Inc."},
    {name = "IdentityPublisher", value = "CN=7FB784C5-4411-4067-914E-A7B06CC00FFC"}
] }
winappinstallermsix = { file = "deploy/msix/PackagingLayout.xml", variables = [
    {name = "FlatBundle", value="true"},
    {name = "PublisherDisplayName", value="JuliaHub, Inc."},
    {name = "IdentityPublisher", value = "CN=&quot;JuliaHub, Inc.&quot;, O=&quot;JuliaHub, Inc.&quot;, L=CAMBRIDGE, S=Massachusetts, C=US"}
] }

[package.metadata.winappinstaller]
winappinstaller = "deploy/winappinstaller/Julia.appinstaller"

[package.metadata.winres]

# The 'julia' and 'julialauncher' binaries are effectively replaced by gup's multiplexer mode.
# We will have one main 'gup' binary and potentially a 'gup-bootstrap' for initial setup.

[[bin]]
name = "gup"
path = "src/bin/gup.rs"

[[bin]]
name = "gup-bootstrap"
path = "src/bin/gup_bootstrap.rs"
required-features = ["bingupbootstrap"]
